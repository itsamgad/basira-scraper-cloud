# ╭─────────────────────────────────────────────────────────────╮
# │  Basira Scraper — Cloudflare Pages config                    │
# ╰─────────────────────────────────────────────────────────────╯
#
# Pages reads this file at the repo root to get:
#   - compatibility_date / compatibility_flags
#   - which directory to serve as the static site
#   - bindings (Browser Rendering, KV) for the Functions in pages/functions/
#
# After connecting the GitHub repo to Pages, you only need to:
#   1) make sure the KV namespace id below matches yours
#      (run  wrangler kv namespace create BASIRA_KV  if you don't
#       have one yet, then paste the returned id here)
#   2) push to GitHub. Pages will redeploy automatically.

name = "basira-scraper"
pages_build_output_dir = "pages"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# ── Browser Rendering binding ──────────────────────────────
# This is the binding @cloudflare/playwright reads when you call
# `launch(env.MYBROWSER)` inside a Pages Function.
[browser]
binding = "MYBROWSER"

# ── KV namespace for history + per-job results + progress ──
# If you've already created BASIRA_KV for the old worker setup,
# you can re-use the same namespace id here.
[[kv_namespaces]]
binding = "BASIRA_KV"
id = "7405e5d465284b7eaa7c30ce0393406e"

# ── Plain variables ────────────────────────────────────────
[vars]
MAX_ROWS_HARD_CAP = "5000"
