<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basira Scraper · Run</title>
  <link rel="icon" type="image/png" href="/basira-logo.png" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <!-- Top nav (only shown for manual / loading / results screens; hidden while iframe is full-screen) -->
  <nav class="bs-nav" id="top-nav">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="/basira-logo.png" style="width:32px;height:32px;object-fit:contain" alt="logo"/>
      <span class="bs-brand" style="font-size:1.1rem">Basira Scraper</span>
      <span id="hostname-badge" style="color:var(--text-muted);font-size:.75rem"></span>
      <span id="stealth-badge" class="bs-badge" hidden>🥷 Stealth</span>
    </div>
    <div class="bs-nav-actions">
      <button id="export-csv"  class="bs-btn bs-btn-ghost" hidden style="padding:8px 14px;font-size:.8rem;color:var(--success);border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.07)">↓ CSV</button>
      <button id="export-json" class="bs-btn bs-btn-ghost" hidden style="padding:8px 14px;font-size:.8rem">↓ JSON</button>
      <button id="back-btn"    class="bs-btn bs-btn-ghost" style="padding:8px 14px;font-size:.8rem">← New</button>
    </div>
  </nav>

  <!-- ──── Visual selection workspace (full-screen iframe, no chrome) ──── -->
  <!-- Mirrors the original maximized Chromium window: target page fills    -->
  <!-- the viewport and the sidebar overlay (injected by the worker proxy)  -->
  <!-- floats on the right.                                                 -->
  <div id="select-screen" class="bs-iframe-fullscreen" hidden>
    <iframe id="selection-iframe" class="bs-iframe-full" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <!-- Tiny floating fallback notice in case the iframe stays blank -->
    <div id="iframe-blank-hint" class="bs-iframe-blank-hint" hidden>
      <div style="font-size:.85rem;font-weight:700;margin-bottom:6px">⚠️ This site blocks framing</div>
      <div style="font-size:.78rem;color:var(--text-dim);margin-bottom:10px" id="iframe-note"></div>
      <button id="switch-to-manual" class="bs-btn bs-btn-primary bs-btn-full" style="font-size:.8rem">Switch to manual mode</button>
    </div>
  </div>

  <!-- ──── Manual selectors workspace ─────────────────────── -->
  <div id="manual-screen" class="bs-page" hidden>
    <div class="bs-card" style="max-width:760px;width:100%;margin:0 auto">
      <div class="bs-section-head">
        <span class="bs-section-title">✋ <span id="manual-title">Manual selectors</span></span>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <label style="font-size:.74rem;color:var(--text-dim)" id="lbl-parent">List container selector</label>
        <input id="m-parent" class="bs-input" placeholder=".product-list" />

        <label style="font-size:.74rem;color:var(--text-dim);margin-top:8px" id="lbl-item">Item selector</label>
        <input id="m-item" class="bs-input" placeholder=".product-card" />

        <label style="font-size:.74rem;color:var(--text-dim);margin-top:8px" id="lbl-fields">Fields</label>
        <div id="m-fields"></div>
        <button id="m-add-field" class="bs-btn bs-btn-ghost" style="align-self:flex-start" type="button">+ <span id="lbl-add">Add field</span></button>

        <label style="font-size:.74rem;color:var(--text-dim);margin-top:8px">Loading method</label>
        <select id="m-method" class="bs-input">
          <option value="auto-scroll">↕ Auto-scroll</option>
          <option value="pagination">📄 Pagination</option>
          <option value="load-more">➕ Load more</option>
        </select>

        <div id="m-extra-row" hidden>
          <label id="lbl-extra" style="font-size:.74rem;color:var(--text-dim);margin-top:8px"></label>
          <input id="m-extra" class="bs-input" placeholder=".pagination .next" />
        </div>

        <button id="m-run" class="bs-btn bs-btn-primary bs-btn-full" style="margin-top:14px"><span id="lbl-run">⚡ Run scrape</span></button>
      </div>
    </div>
  </div>

  <!-- ──── Loading / progress screen ─────────────────────── -->
  <div id="loading-screen" class="bs-loading-box" hidden>
    <div class="bs-loading-inner">
      <div class="bs-spinner" style="margin:0 auto 24px"></div>
      <div class="bs-loading-title" id="loading-title">Extracting Data</div>
      <div class="bs-loading-sub"   id="loading-sub">Collecting items across all pages</div>
    </div>
  </div>

  <!-- ──── Error screen ──────────────────────────────────── -->
  <div id="error-screen" class="bs-loading-box" hidden>
    <div class="bs-loading-inner">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,.08);border:2px solid rgba(239,68,68,.2);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 24px">⚠️</div>
      <div class="bs-loading-title" style="color:var(--danger)" id="error-title">Something went wrong</div>
      <div class="bs-loading-sub" id="error-sub" style="margin-bottom:24px"></div>
      <button id="error-back" class="bs-btn bs-btn-primary">← New</button>
    </div>
  </div>

  <!-- ──── Results screen ───────────────────────────────── -->
  <div id="results-screen" class="bs-results-layout" hidden>
    <aside class="bs-sidebar">
      <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:14px;text-align:center">
        <div style="font-size:22px;margin-bottom:4px">✅</div>
        <div style="font-size:.72rem;font-weight:800;color:var(--success);letter-spacing:.5px" id="lbl-complete">EXTRACTION COMPLETE</div>
      </div>

      <div>
        <div class="bs-sidebar-section-title" id="lbl-summary">Summary</div>
        <div id="summary-rows" style="display:flex;flex-direction:column;gap:6px"></div>
      </div>

      <div>
        <div class="bs-sidebar-section-title" id="lbl-fields">Fields</div>
        <div id="fields-chips" style="display:flex;flex-direction:column;gap:5px"></div>
      </div>

      <div style="margin-top:auto">
        <div class="bs-sidebar-section-title" id="lbl-export">Export</div>
        <div style="display:flex;flex-direction:column;gap:7px">
          <button id="export-csv-side"  class="bs-btn bs-btn-primary bs-btn-full">↓ CSV</button>
          <button id="export-json-side" class="bs-btn bs-btn-ghost bs-btn-full">↓ JSON</button>
        </div>
      </div>
    </aside>

    <main class="bs-results-main">
      <div class="bs-search-row">
        <input id="results-search" class="bs-input bs-input-sm" type="text" placeholder="🔍 Search..." style="padding-inline-start:16px;direction:ltr" />
        <span id="results-count" class="bs-count-badge"></span>
      </div>
      <div class="bs-table-wrap">
        <table class="bs-table">
          <thead><tr id="results-head"></tr></thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/scraper-page.js"></script>
</body>
</html>
