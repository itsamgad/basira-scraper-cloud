<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basira Scraper · View</title>
  <link rel="icon" type="image/png" href="/basira-logo.png" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <nav class="bs-nav">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="/basira-logo.png" style="width:32px;height:32px;object-fit:contain" alt="logo"/>
      <span class="bs-brand" style="font-size:1.1rem">Basira Scraper</span>
      <span id="job-meta" style="color:var(--text-muted);font-size:.75rem"></span>
    </div>
    <div class="bs-nav-actions">
      <button id="export-csv"  class="bs-btn bs-btn-ghost" style="padding:8px 14px;font-size:.8rem;color:var(--success);border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.07)">↓ CSV</button>
      <button id="export-json" class="bs-btn bs-btn-ghost" style="padding:8px 14px;font-size:.8rem">↓ JSON</button>
      <a href="/" class="bs-btn bs-btn-ghost" style="padding:8px 14px;font-size:.8rem;text-decoration:none">← Home</a>
    </div>
  </nav>

  <div id="loading-screen" class="bs-loading-box">
    <div class="bs-loading-inner">
      <div class="bs-spinner" style="margin:0 auto 20px"></div>
      <p style="color:var(--text-dim);font-size:.86rem">Loading data...</p>
    </div>
  </div>

  <div id="error-screen" class="bs-loading-box" hidden>
    <div class="bs-loading-inner">
      <div style="text-align:center;color:var(--danger);font-size:.9rem" id="error-msg">⚠️ Data not found</div>
    </div>
  </div>

  <div id="results-screen" class="bs-results-layout" hidden>
    <aside class="bs-sidebar">
      <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:14px;text-align:center">
        <div style="font-size:22px;margin-bottom:4px">✅</div>
        <div style="font-size:.72rem;font-weight:800;color:var(--success);letter-spacing:.5px">EXTRACTION COMPLETE</div>
      </div>

      <div>
        <div class="bs-sidebar-section-title">SUMMARY</div>
        <div id="summary-rows" style="display:flex;flex-direction:column;gap:6px"></div>
      </div>

      <div>
        <div class="bs-sidebar-section-title">FIELDS</div>
        <div id="fields-chips" style="display:flex;flex-direction:column;gap:5px"></div>
      </div>

      <div style="margin-top:auto">
        <div class="bs-sidebar-section-title">EXPORT</div>
        <div style="display:flex;flex-direction:column;gap:7px">
          <button id="export-csv-side"  class="bs-btn bs-btn-primary bs-btn-full">↓ Download CSV</button>
          <button id="export-json-side" class="bs-btn bs-btn-ghost bs-btn-full">↓ Download JSON</button>
        </div>
      </div>
    </aside>

    <main class="bs-results-main">
      <div class="bs-search-row">
        <input id="results-search" class="bs-input bs-input-sm" type="text" placeholder="🔍 Search..." style="direction:ltr" />
        <span id="results-count" class="bs-count-badge"></span>
      </div>
      <div class="bs-table-wrap">
        <table class="bs-table">
          <thead><tr id="results-head"></tr></thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/view-page.js"></script>
</body>
</html>
